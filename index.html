    save();render();toast(added?`${added} événement${added>1?'s':''} importé${added>1?'s':''}${allDay?` (${allDay} journée${allDay>1?'s':''} entière${allDay>1?'s':''} ignorée${allDay>1?'s':''})`:''}`:'Aucun nouvel événement trouvé sur les 12 prochaines semaines.');
  },
  icsClear:()=>{state.events=state.events.filter(e=>e.src!=='ics');save();render();toast('Agenda importé effacé');},
  bkExport:()=>{saveFile('gestionnary-sauvegarde-'+ymd(new Date())+'.json',JSON.stringify(state),'application/json');},
  bkCopy:()=>{const t=JSON.stringify(state);copy(t,null);},
  bkImport:async()=>{
    const fi=document.getElementById('bkfile'),ta=document.getElementById('bktext');let txt='';
    if(fi&&fi.files&&fi.files[0])txt=await fi.files[0].text();else if(ta)txt=ta.value.trim();
    if(!txt){toast('Choisis un fichier ou colle une sauvegarde.');return;}
    try{const o=JSON.parse(txt);if(!o||!Array.isArray(o.tasks))throw 0;state=normalize(o);save();ui.view='semaine';render();toast('Sauvegarde restaurée');}catch(e){toast('Sauvegarde illisible : vérifie que tu as copié tout le texte.');}
  },
  resetAsk:()=>{ui.confirmReset=true;render();},
  resetNo:()=>{ui.confirmReset=false;render();},
  resetGo:()=>{ui.confirmReset=false;state=blank();save();render();toast('Tout est effacé. Page blanche.');}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='INPUT'&&el.type==='checkbox'){return;}const f=A[el.dataset.act];if(f){if(el.tagName==='BUTTON')e.preventDefault();f(el,e);}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('input[type=checkbox][data-act]')){const f=A[el.dataset.act];if(f)f(el,e);return;}
  if(el.dataset.actChange==='nnAdd'&&el.value){const t=find(el.value);if(t&&state.tasks.filter(x=>x.nonneg&&x.status!=='done').length<3){t.nonneg=true;save();render();}return;}
  if(el.dataset.set){const k=el.dataset.set;let v=el.value;const S=state.settings;if(el.type==='number'){v=Number(v);if(!isFinite(v))return;if(el.min!==''&&v<Number(el.min))v=Number(el.min);if(el.max!==''&&v>Number(el.max))v=Number(el.max);}S[k]=v;if(k==='pomoWork'||k==='pomoBreak'){if(!ui.pomo.running)ui.pomo.left=null;}save();render();return;}
  if(el.dataset.meal){const m=state.settings.meals.find(x=>x.id===el.dataset.meal);if(!m)return;const f=el.dataset.mf;m[f]=f==='on'?el.checked:f==='dur'?Number(el.value)||0:el.value;save();render();return;}
  if(el.dataset.rec){const r=state.settings.recurring.find(x=>x.id===el.dataset.rec);if(r){r[el.dataset.rf]=el.value;save();render();}return;}
  if(el.dataset.voy){const v=state.voyants.find(x=>x.id===el.dataset.voy);if(!v)return;const f=el.dataset.vf;v[f]=(f==='label'||f==='dir')?el.value:Number(el.value);save();render();return;}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.fiche){const f=state.fiches.find(x=>x.id===el.dataset.fiche);if(!f)return;if(el.dataset.ff==='title')f.title=el.value;else{const s=f.steps[+el.dataset.i];if(s)s.text=el.value;}save();return;}
  if(el.dataset.prof){state.profile[el.dataset.prof]=el.value;save();return;}
  if(el.dataset.pm){const p=state.premortem.find(x=>x.id===el.dataset.pm);if(p){p[el.dataset.pf]=el.value;save();}return;}
});
document.addEventListener('submit',e=>{
  const form=e.target;const k=form.dataset.form;if(!k)return;e.preventDefault();
  if(k==='wiz'){const st=ui.wiz;if(st===1){const n=document.getElementById('w_name').value.trim();if(!n){toast('Ton prénom, pour qu\'on se connaisse.');return;}state.profile.name=n;state.profile.project=document.getElementById('w_proj').value.trim();state.profile.pitch=document.getElementById('w_pitch').value.trim();save();openWiz(2);return;}
    if(st===2){const S=state.settings;S.wake=document.getElementById('w_wake').value||S.wake;S.sleepHours=Math.min(10,Math.max(8,Number(document.getElementById('w_sleep').value)||8));S.commute=Math.max(0,Number(document.getElementById('w_com').value)||0);S.maxPerDay=Math.min(10,Math.max(0.5,Number(document.getElementById('w_max').value)||3));S.engagementStart=ymd(new Date());save();openWiz(3);return;}return;}
  if(k==='quick'){const i=document.getElementById('quickin');const v=i.value.trim();if(!v)return;state.inbox.unshift({id:uid(),text:v});save();render();toast('Noté dans ton Vide-tête');const n=document.getElementById('quickin');if(n)n.focus();return;}
  if(k==='inbox'){const i=document.getElementById('inboxinput');const v=i.value.trim();if(!v)return;state.inbox.unshift({id:uid(),text:v});save();render();const n=document.getElementById('inboxinput');if(n)n.focus();return;}
  if(k==='ms'){const t=document.getElementById('mstitle').value.trim();if(!t)return;state.milestones.push({id:uid(),title:t,measure:document.getElementById('msmeasure').value.trim(),date:document.getElementById('msdate').value||null,done:false});save();render();toast('Jalon ajouté');return;}
  if(k==='carnet'){const a={};let any=false;QS.forEach(([q])=>{const v=document.getElementById('q_'+q).value.trim();if(v){a[q]=v;any=true;}});if(!any){toast('Réponds au moins à une question.');return;}state.carnet.push({id:uid(),date:ymd(new Date()),a});save();render();toast('Bilan enregistré. Prochain dans 14 jours.');return;}
  if(k==='task'&&ui.editing){const t=ui.editing.task;const title=document.getElementById('t_title').value.trim();if(!title)return;
    const status=document.getElementById('t_status').value;
    if(status==='doing'&&t.status!=='doing'&&state.tasks.filter(x=>x.status==='doing'&&x.id!==t.id).length>=3){toast('Déjà 3 tâches en cours : termine ou repose-en une d\'abord.');return;}
    const nn=document.getElementById('t_nn').checked;
    if(nn&&!t.nonneg&&state.tasks.filter(x=>x.nonneg&&x.status!=='done'&&x.id!==t.id).length>=3){toast('Déjà 3 non négociables : retires-en une avant.');return;}
    if(status==='done'&&t.status!=='done')t.doneAt=Date.now();Object.assign(t,{title,est:Math.max(5,Number(document.getElementById('t_est').value)||60),deadline:document.getElementById('t_deadline').value||null,milestone:document.getElementById('t_ms').value||null,status,urgent:document.getElementById('t_u').checked,important:document.getElementById('t_i').checked,nonneg:nn});
    if(ui.editing.isNew)state.tasks.push(t);
    if(ui.fromInbox){state.inbox=state.inbox.filter(i=>i.id!==ui.fromInbox);ui.fromInbox=null;}
    closeModal();save();render();toast('Tâche enregistrée');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modalroot').innerHTML&&ui.wiz==null)closeModal();});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.prof)renderShell();});

/* ---------- Démarrage ---------- */
function seedValidate(){const lim=ymd(addDays(new Date(),1));state.slots.forEach(s=>{if(s.status==='proposed'&&s.start.slice(0,10)<=lim)s.status='validated';});}
if(firstRun){propose();seedValidate();save();}
render();
if(firstRun)openWiz(0);
})();
</script>
